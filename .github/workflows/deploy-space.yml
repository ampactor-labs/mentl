name: Deploy mentl space to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ide/**'
      - 'boot/**'
      - 'lib/**'
      - 'src/types.mn'
      - 'tools/space-stage.sh'
      - '.github/workflows/deploy-space.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage mentl space
        # ide/space.manifest is the one home of what the site is; the IDE
        # gate serves this same staged directory, so a file the page needs
        # and the deploy lacks is a red gate, never a 404 found live.
        run: bash tools/space-stage.sh .build/space
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/space
      - id: deployment
        uses: actions/deploy-pages@v4
