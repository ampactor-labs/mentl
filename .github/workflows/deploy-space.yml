name: Deploy mentl space to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ide/**'
      - '.github/workflows/deploy-space.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage mentl space
        run: |
          mkdir -p _site/boot
          cp -r ide/* _site/
          cp boot/mentl.wasm _site/boot/
          # The IDE also fetches lib/*.mn and src/types.mn for the tutorials
          mkdir -p _site/lib _site/src
          cp -r lib/tutorial _site/lib/
          cp src/types.mn _site/src/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
