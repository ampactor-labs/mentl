<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mentl space</title>
<meta name="description" content="Mentl Space — the medium, compiled by itself: the pinned fixpoint compiler judging in your browser, projecting the eight aspects at the caret.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0809'/%3E%3Cpolygon points='16,4 23,7 26,15 23,23 16,26 9,23 6,15 9,7' fill='none' stroke='%23E69F00' stroke-width='1.6'/%3E%3Cpolygon points='16,11 19,12 20,15 19,18 16,19 13,18 12,15 13,12' fill='none' stroke='%23D55E00' stroke-width='1.3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ── the page — every pixel a projection of a fact the compiler holds ──── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--canvas); color: var(--primary);
    font-family: var(--sans); font-size: 13px; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr; height: 100vh;
  }
  ::selection { background: var(--selection); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-lift); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  code, pre, textarea, .mono { font-family: var(--mono); }

  /* ── header ─────────────────────────────────────────────────────────────── */
  header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--abyss); }
  .mark { display: flex; align-items: center; gap: 10px; }
  .mark svg { width: 28px; height: 28px; display: block; }
  .wordmark { font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: .03em; color: var(--bright); }
  .wordmark span { color: var(--muted); font-weight: 400; margin-left: 4px; }
  select { background: var(--raised2); color: var(--primary); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font: inherit; font-size: 12px; }
  select:hover { border-color: var(--border-lift); }
  #find { background: var(--raised2); color: var(--primary); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font: 12px var(--mono); width: 210px; }
  #find::placeholder { color: var(--faint); font-family: var(--sans); }
  #find:focus { outline: 0; border-color: var(--gold); }
  .facet.lit { border-color: var(--gold); background: var(--raised2); }
  .grow { margin-left: auto; }
  button.icon { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 7px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
  button.icon:hover { color: var(--bright); border-color: var(--border-lift); }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ghost); flex: none; transition: background .25s, box-shadow .25s; }
  #dot.busy { background: var(--gold); box-shadow: var(--glow-gold); }
  #dot.ok { background: var(--green); }
  #dot.diag { background: var(--gold); }
  #dot.bad { background: var(--verm); }
  #err-banner { display: none; padding: 12px 16px; background: var(--raised2); color: var(--verm-b); border-bottom: 1px solid var(--verm); font-size: 12px; white-space: pre-wrap; font-family: var(--mono); }

  /* ── main: the canvas | the rail ───────────────────────────────────────── */
  main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, 1fr); min-height: 0; }
  .canvas-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .edwrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--canvas); }
  /* the gutter (the aspect strip, then the line numbers), the topology
     layer, the highlighted projection and the textarea the hand types into
     share ONE font, ONE padding and ONE scroll — the textarea's text is
     transparent, so the projection is what you see and the caret is real.
     Only the lines in view are painted (the projection is virtualized): a
     spacer above and below holds the scroll the textarea has. */
  .edwrap { --gw: 132px; }
  #gutter { position: absolute; left: 0; top: 0; bottom: 0; width: var(--gw); padding: 16px 0 40vh; font: 13px/1.62 var(--mono);
    color: var(--ghost); user-select: none; overflow: hidden; border-right: 1px solid var(--line); background: var(--raised1); }
  #gutter .gl { display: flex; align-items: center; white-space: pre; }
  #gutter .strip { display: flex; padding-left: 6px; }
  #gutter .cell { width: 9px; text-align: center; font-size: 10px; cursor: pointer; opacity: .9; }
  #gutter .cell:hover { opacity: 1; filter: brightness(1.3); }
  #gutter .cell.st-refused { color: var(--verm-b); font-weight: 700; }
  #gutter .cell.st-warned { text-decoration: underline dotted; opacity: .7; }
  #gutter .num { margin-left: auto; padding-right: 10px; }
  #gutter .gl.cur .num { color: var(--gold-b); }
  #gutter .gl.bad .num { color: var(--verm-b); }
  .a-query { color: var(--blue-b); } .a-propose { color: var(--verm-b); } .a-topology { color: var(--sky-b); } .a-effects { color: var(--gold-b); }
  .a-ownership { color: var(--mag-b); } .a-verify { color: var(--green-b); } .a-teach { color: var(--gold-b); } .a-why { color: var(--blue-b); }
  #topo { position: absolute; inset: 0; left: var(--gw); pointer-events: none; z-index: 1; overflow: visible; }
  .edwrap pre, .edwrap textarea {
    position: absolute; top: 0; right: 0; bottom: 0; left: var(--gw); padding: 16px 20px 40vh 16px; margin: 0;
    font: 13px/1.62 var(--mono); font-variant-ligatures: none; white-space: pre; overflow: auto; tab-size: 2; border: 0; outline: 0; resize: none;
    letter-spacing: 0; scrollbar-width: thin;
  }
  .edwrap pre { pointer-events: none; color: var(--primary); z-index: 2; }
  .edwrap pre .ln { white-space: pre; }
  .edwrap textarea { background: transparent; color: transparent; caret-color: var(--gold-b); z-index: 3; }
  .edwrap textarea::selection { background: var(--selection); }
  /* token colors — each hue IS its kernel role (tokens.css) */
  .tk-kw   { color: var(--blue-b); }
  .tk-disc { color: var(--mag-b); }
  .tk-verb { color: var(--sky-b); font-weight: 700; }
  .tk-hole { color: var(--verm-b); font-weight: 700; }
  .tk-str  { color: var(--wheat); }
  .tk-spl  { color: var(--bright); }
  .tk-num  { color: var(--verm-b); }
  .tk-ty   { color: var(--gold-b); }
  .tk-neg  { color: var(--verm-b); font-weight: 700; }
  .tk-fn   { color: var(--green-b); }
  .tk-cm   { color: var(--comment); font-style: italic; }
  .tk-self { color: var(--verm-b); font-style: italic; }
  .ln.ln-bad  { background: linear-gradient(90deg, rgba(213,94,0,.16), transparent 70%); }
  .ln.ln-cur  { background: linear-gradient(90deg, rgba(230,159,0,.09), transparent 80%); }

  /* the proposal strip — the cursor line's one proven move; Tab accepts */
  .proposal { border-top: 1px solid var(--border); padding: 7px 16px; font-size: 12px; font-family: var(--mono);
    display: flex; gap: 12px; align-items: baseline; background: var(--raised1); }
  .proposal .tag { font-family: var(--sans); font-size: 10px; color: var(--green-b); border: 1px solid var(--green); border-radius: 3px; padding: 1px 6px; flex: none; }
  .proposal .was { color: var(--ghost); text-decoration: line-through; }
  .proposal .now { color: var(--green-b); }
  .proposal .why { color: var(--muted); font-family: var(--sans); font-size: 11px; }
  .proposal .key { font-family: var(--sans); font-size: 10px; color: var(--whisper); margin-left: auto; flex: none; }
  .proposal .key b { border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; }
  .proposal .socket { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 6px;
    background: var(--verm-b); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }

  /* ── the rail: the aspect ring, then Lens | Ledger ──────────────────────── */
  .rail { display: grid; grid-template-rows: auto 1fr; border-left: 1px solid var(--border); background: var(--raised1); min-height: 0; }
  .aspect { border-bottom: 1px solid var(--border); padding: 12px 14px 14px; overflow: auto; max-height: 52vh; }
  .aspect h4 { font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .aspect h4 .at { margin-left: auto; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--mono); font-size: 10.5px; }
  /* one label column for the whole ring, sized by its widest label and badge (a 72px column let "ownership REAL" run into the text) */
  .facets { display: grid; grid-template-columns: 14px max-content 1fr; gap: 4px 8px; }
  .facet { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; padding: 5px 8px; border-radius: 8px;
    border: 1px solid transparent; }
  .facet::before { content: ""; width: 7px; height: 7px; align-self: center; background: currentColor; opacity: .85;
    clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .facet.door { cursor: pointer; }
  .facet.door:hover { background: var(--raised2); border-color: var(--border); }
  .facet.real { background: linear-gradient(90deg, rgba(230,159,0,.07), transparent 75%); }
  .facet .k { font-size: 10px; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
  .prov { margin-left: auto; font-size: 8px; letter-spacing: .07em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--faint); }
  .prov-real { color: var(--gold-b); border-color: var(--gold); }
  .prov-surface { color: var(--whisper); }
  .prov-socket { color: var(--verm); border-color: var(--verm); }
  .facet .v { font-size: 12px; color: var(--primary); word-break: break-word; line-height: 1.45; font-family: var(--mono); }
  .facet .v .stub { color: var(--faint); font-style: italic; font-size: 11px; font-family: var(--sans); }
  .facet .v .sub { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; font-family: var(--sans); }
  .facet .v .lede { display: block; color: var(--muted); font-family: var(--sans); font-style: italic; font-size: 11.5px; margin-bottom: 3px; }
  .facet .v .hop { display: block; padding-left: 12px; color: var(--muted); }
  .facet .v .hop[data-l] { cursor: pointer; }
  .facet.real .v { animation: surface .22s var(--e-surface); }
  .k-graph { color: var(--blue-b); } .k-hand { color: var(--green-b); } .k-verb { color: var(--sky-b); }
  .k-row { color: var(--gold-b); } .k-own { color: var(--mag-b); } .k-ref { color: var(--verm-b); }
  .k-grad { color: var(--gold-b); } .k-why { color: var(--blue-b); }
  @keyframes surface { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .rail-lower { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--abyss); padding: 0 6px; }
  .tabs div { padding: 8px 13px; color: var(--muted); cursor: pointer; font-size: 11.5px; border-bottom: 2px solid transparent; letter-spacing: .02em; }
  .tabs div:hover { color: var(--primary); }
  .tabs div.on { color: var(--gold-b); border-bottom-color: var(--gold); }
  .tabs div .n { margin-left: 6px; font-size: 10px; color: var(--abyss); background: var(--muted); border-radius: 8px; padding: 1px 6px; font-family: var(--mono); }
  .tabs div.on .n { background: var(--gold); }
  .tabs .meta { margin-left: auto; color: var(--ghost); font-size: 10.5px; cursor: default; font-family: var(--mono); }
  .tabs .meta:hover { color: var(--ghost); }
  .panel { overflow: auto; display: none; min-height: 0; }
  .panel.on { display: block; }

  /* the Lens — the diagnostics, as the kinds they are, under one lead */
  .lead { padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--raised2); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
  .lead b { color: var(--bright); }
  .diag { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .diag:hover { background: var(--raised2); }
  .diag .row1 { display: flex; align-items: baseline; gap: 9px; }
  .diag .code { font-weight: 700; font-size: 12px; font-family: var(--mono); }
  .diag .code { color: var(--gold-b); } .diag.sev-error .code { color: var(--verm-b); } .diag.sev-VerificationPending .code { color: var(--mag-b); } .diag.appl-MachineApplicable .code { color: var(--sky-b); }
  .diag .at { color: var(--ghost); font-size: 11px; }
  .diag .appl { margin-left: auto; font-size: 9.5px; color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  .diag .msg { color: var(--muted); margin-top: 4px; font-size: 12px; line-height: 1.5; }
  .empty { padding: 40px 22px; text-align: center; color: var(--faint); }
  .empty .big { font-size: 30px; margin-bottom: 12px; color: var(--green-b); }
  .empty .sub { font-size: 11px; color: var(--ghost); margin-top: 8px; }

  /* the Ledger — the module's declarations, obligations and tightenings, ranked for the caret */
  .ledger { padding: 14px; }
  .ledger section { margin-bottom: 18px; }
  .ledger h5 { font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--faint); margin-bottom: 9px; }
  .ledger .decl { padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1.5; }
  .ledger .decl:hover { background: var(--raised2); }
  .ledger .decl .word { color: var(--blue-b); font-family: var(--mono); font-size: 11px; }
  .ledger .decl .name { color: var(--green-b); font-weight: 600; }
  .ledger .decl .text { color: var(--muted); font-family: var(--mono); font-size: 11.5px; display: block; padding-left: 8px; }
  .ledger .item { font-size: 12px; color: var(--primary); padding: 3px 6px; font-family: var(--mono); cursor: pointer; border-radius: 6px; }
  .ledger .item:hover { background: var(--raised2); }
  .ledger .item .at { color: var(--ghost); font-size: 11px; margin-left: 6px; font-family: var(--sans); }
  .subtle { color: var(--faint); font-size: 11px; font-style: italic; line-height: 1.5; }
  .ledger code, .lead code, .diag code { color: var(--bright); background: var(--raised2); padding: 0 4px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .rail { border-left: 0; border-top: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <div class="mark">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <polygon points="16,3 24,6.5 28,16 24,25.5 16,29 8,25.5 4,16 8,6.5" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity=".7"/>
      <polygon points="16,11 19.5,12.5 21,16 19.5,19.5 16,21 12.5,19.5 11,16 12.5,12.5" fill="none" stroke="var(--verm)" stroke-width="1.3"/>
    </svg>
    <div class="wordmark">mentl<span>space</span></div>
  </div>
  <select id="program" title="the program — a lesson, or your own"></select>
  <input id="find" spellcheck="false" autocomplete="off" placeholder="find by edge — a name, then ⏎" title="the references the graph noted under a name, and the string literals holding it">
  <div class="grow"></div>
  <button class="icon" id="theme" title="obsidian / parchment">◐</button>
  <div id="dot" title="the compiler"></div>
</header>
<main>
  <div class="canvas-pane">
    <div id="err-banner"></div>
    <div class="edwrap">
      <div id="gutter"></div>
      <svg id="topo" aria-hidden="true"><g id="topo-g"></g></svg>
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="the program"></textarea>
    </div>
    <div id="proposal" class="proposal" hidden></div>
  </div>
  <div class="rail">
    <div class="aspect">
      <h4>aspect ring <span class="at" id="asp-at">— place the caret —</span></h4>
      <div class="facets" id="facets"></div>
    </div>
    <div class="rail-lower">
      <div class="tabs">
        <div data-p="plens" class="on">Lens <span class="n" id="ndiag">0</span></div>
        <div data-p="pledger">Ledger</div>
        <div data-p="prefs">Refs <span class="n" id="nrefs">0</span></div>
        <div class="meta" id="sessinfo" title="the session that answered, and what the answer cost">—</div>
      </div>
      <div class="panel on" id="plens"></div>
      <div class="panel" id="pledger"></div>
      <div class="panel" id="prefs"></div>
    </div>
  </div>
</main>
<script src="session-client.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const te = new TextEncoder(), td = new TextDecoder();
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ── isolation: the page's own service worker adds COOP/COEP where the host
   cannot, and reloads once so the document is isolated (ide/isolate.js) ── */
async function ensureIsolated(){
  // The worker is registered on every secure host, so every file the page
  // fetches is kept for the next open, offline included; the reload is
  // needed only where the host set no isolation headers (the worker adds
  // them to the next load). A host that sets them needs no reload.
  if ("serviceWorker" in navigator && window.isSecureContext) {
    try {
      await navigator.serviceWorker.register("./isolate.js");
      if (!crossOriginIsolated) {
        await navigator.serviceWorker.ready;
        if (!sessionStorage.getItem("isolate-reload")) { sessionStorage.setItem("isolate-reload", "1"); location.reload(); }
        return false;
      }
    } catch (e) { if (!crossOriginIsolated) return false; }
  }
  return crossOriginIsolated;
}

/* ── the manifest — one home of what the page fetches ───────────────────── */
let BASE = "../", WASM_PATH = "boot/mentl.wasm", LIBS = [], PROGRAMS = [], PROJECTS = [];
async function readManifest(){
  const r = await fetch("./space.manifest", { cache: "no-store" });
  if (!r.ok) throw new Error("space.manifest is missing beside the page");
  for (const raw of (await r.text()).split("\n")){
    const line = raw.trim(); if (!line || line.startsWith("#")) continue;
    const [kind, path] = line.split(/\s+/, 2);
    if (kind === "root") BASE = path.replace(/\/?$/, "/");
    else if (kind === "wasm") WASM_PATH = path;
    else if (kind === "lib") LIBS.push(path);
    else if (kind === "program") PROGRAMS.push(path);
    else if (kind === "project") PROJECTS.push({ dir: path, members: [] });
    else if (kind === "member" && PROJECTS.length) PROJECTS[PROJECTS.length - 1].members.push(path);
  }
}
async function fetchText(path){
  const r = await fetch(BASE + path);
  if (!r.ok) throw new Error(`${path} is missing (${r.status}) — the site must stage every file space.manifest names (tools/space-stage.sh)`);
  return r.text();
}

/* ── the canvas: the wheel's own projection of the text (src/space.mn) ─────
   `mentl space <file>:0` answers the module's canvas — every token at its
   span and class (the ONE lexer: the page holds none), the aspect strip,
   the verb frames, the proof marks and the ownership traces. The page
   slices the SOURCE at the wheel's spans, so a character the hand typed
   cannot vanish, and paints only the lines in view. Columns on the wire are
   the text's BYTES (a lexer's columns); the page converts them per line,
   which is the host's encoding, not a second reading of the program. */
const ARMS = ["query", "propose", "topology", "effects", "ownership", "verify", "teach", "why"];
const CLS = { kw:"tk-kw", disc:"tk-disc", verb:"tk-verb", hole:"tk-hole", str:"tk-str", spl:"tk-spl", num:"tk-num", cm:"tk-cm", ty:"tk-ty", fn:"tk-fn", self:"tk-self", neg:"tk-neg" };
// one glyph per aspect and state — the strip's eight columns
const GLYPH = {
  query:     { proven: "τ", open: "τ" },
  propose:   { proven: "⬡", open: "⬡" },
  topology:  { "|>": "▸", "<|": "◂", "><": "⋈", "~>": "⊃", "<~": "↺" },
  effects:   { proven: "◆", open: "◇" },
  ownership: { proven: "●", open: "○" },
  verify:    { proven: "✓", open: "◌" },
  teach:     { proven: "↑", open: "↑" },
  why:       { proven: "¶", open: "¶" },
};
const glyphOf = (arm, c) => c.glyph === "refused" ? "✗" : (arm === "topology" ? (GLYPH.topology[c.word] || "▸") : (GLYPH[arm][c.glyph] || GLYPH[arm].proven));
let CANVAS = null, CANVAS_TEXT = null, CANVAS_FILE = null;   // the module View's canvas and the text it was read off
let TOK = new Map(), STRIP = new Map();                        // canvas line → its tokens [byte start, byte end, class]; → its eight cells
function takeCanvas(cv, text){
  CANVAS = cv; CANVAS_TEXT = text; CANVAS_FILE = FILE; TOK = new Map(); STRIP = new Map();
  if (!cv) return;
  const lines = text.split("\n");
  for (const [sl, sc, el, ec, cls] of cv.tokens){
    for (let l = sl; l <= el; l++){
      const from = l === sl ? sc : 1, to = l === el ? ec : te.encode(lines[l - 1] || "").length + 1;
      if (!TOK.has(l)) TOK.set(l, []);
      TOK.get(l).push([from, to, cls]);
    }
  }
  for (const s of cv.strip) STRIP.set(s.line, s.cells);
}
// a byte column of a line (1-based) as the string index the DOM counts
function byteIndex(line, col){
  let b = 1, i = 0;
  while (i < line.length && b < col){ const c = line.codePointAt(i); b += c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4; i += c >= 0x10000 ? 2 : 1; }
  return i;
}
// The canvas was read off the text of the last judgment; while the hand types,
// a line that did not move keeps its facts — the lines above the edit, and the
// lines below it shifted by the edit's height — and a moved line paints plain
// until the next answer. 0 = a line the canvas does not know.
function canvasLine(){
  if (!CANVAS || CANVAS_FILE !== FILE) return () => 0;
  const now = $("src").value;
  if (now === CANVAS_TEXT) return n => n;
  const a = now.split("\n"), b = CANVAS_TEXT.split("\n");
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let q = 0; while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;
  return n => n <= p ? n : (n > a.length - q ? n - (a.length - b.length) : 0);
}
let CURSOR_LINE = 0, BAD = new Set(), VIEW_RANGE = [1, 0];
function paintLine(text, toks){
  if (!toks || !toks.length) return esc(text);
  let html = "", pos = 0;
  for (const [s, e, cls] of toks){
    const i = byteIndex(text, s), j = byteIndex(text, e);
    if (i > pos) html += esc(text.slice(pos, i));          // the gap — every space the hand typed
    const k = CLS[cls];
    html += k ? `<span class="${k}">${esc(text.slice(i, j))}</span>` : esc(text.slice(i, j));
    pos = Math.max(pos, j);
  }
  return html + esc(text.slice(pos));
}
function visibleRange(n){
  const ta = $("src"), first = Math.max(1, Math.floor((ta.scrollTop - PADT) / LH) + 1), count = Math.ceil(ta.clientHeight / LH) + 1;
  return [Math.max(1, first - 40), Math.min(n, first + count + 40)];
}
function renderCanvas(){
  const rows = $("src").value.split("\n"), n = rows.length, at = canvasLine();
  const [a, b] = VIEW_RANGE = visibleRange(n);
  let hl = `<div style="height:${(a - 1) * LH}px"></div>`, gut = `<div style="height:${(a - 1) * LH}px"></div>`;
  for (let i = a; i <= b; i++){
    const o = at(i), c = (i === CURSOR_LINE ? " ln-cur" : "") + (BAD.has(i) ? " ln-bad" : "");
    hl += `<div class="ln${c}" data-n="${i}" style="height:${LH}px">${paintLine(rows[i - 1], o ? TOK.get(o) : null)}</div>`;
    const cells = o ? STRIP.get(o) : null;
    const strip = ARMS.map((arm, k) => { const x = cells && cells[k]; return x ? `<span class="cell a-${arm} st-${x.glyph}" data-arm="${arm}" data-l="${i}" data-c="${byteIndex(rows[i - 1], x.site.line === o ? x.site.col : 1) + 1}" title="${esc(arm + " · " + x.word + " — " + x.text)}">${glyphOf(arm, x)}</span>` : `<span class="cell"> </span>`; }).join("");
    gut += `<div class="gl${i === CURSOR_LINE ? " cur" : ""}${BAD.has(i) ? " bad" : ""}" style="height:${LH}px"><span class="strip">${strip}</span><span class="num">${i}</span></div>`;
  }
  hl += `<div style="height:${(n - b) * LH}px"></div>`; gut += `<div style="height:${(n - b) * LH}px"></div>`;
  $("hl").innerHTML = hl; $("gutter").innerHTML = gut;
  $("gutter").querySelectorAll(".cell[data-arm]").forEach(el => el.onclick = () => openAspect(el.dataset.arm, +el.dataset.l, +el.dataset.c));
  renderTopology(rows, at); syncScroll();
}

/* ── the topographic layer — every shape a read of the graph: the verb frames
   (VerbFrame's sites with what each composes), the proof marks at their
   claims, the traces of owned values, the references a find follows ─────── */
let CW = 7.8, LH = 21.06, PADT = 16, PADL = 16;
function measureMetrics(){
  const ta = $("src"); const cs = getComputedStyle(ta);
  LH = parseFloat(cs.lineHeight) || LH; PADT = parseFloat(cs.paddingTop) || PADT; PADL = parseFloat(cs.paddingLeft) || PADL;
  const ruler = document.createElement("span");
  ruler.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:" + cs.font;
  ruler.textContent = "0".repeat(100); document.body.appendChild(ruler);
  CW = ruler.getBoundingClientRect().width / 100 || CW; ruler.remove();
}
const VERB_HUE = { "|>":"var(--sky-b)", "<|":"var(--sky-b)", "><":"var(--sky-b)", "~>":"var(--gold-b)", "<~":"var(--verm-b)" };
const MARK = { proven: ["✓", "var(--green-b)"], open: ["◌", "var(--mag-b)"], refused: ["✗", "var(--verm-b)"] };
function renderTopology(rows, at){
  const back = new Map(); for (let i = 1; i <= rows.length; i++){ const o = at(i); if (o) back.set(o, i); }
  // a canvas site, placed on the current text: its line, and its column as an index
  const place = (l, col) => { const i = back.get(l); return i ? { i, x: PADL + byteIndex(rows[i - 1], col) * CW } : null; };
  const Y = i => PADT + (i - 1) * LH;
  let out = "";
  // the references a find follows, behind the text
  if (VIEW && VIEW.refs && VIEW_TEXT === $("src").value){
    for (const r of [...VIEW.refs.sites, ...VIEW.refs.texts]) if (r.module === VIEW.at.module){
      const s = r.site, i = s.line, x0 = PADL + byteIndex(rows[i - 1] || "", s.col) * CW, x1 = PADL + byteIndex(rows[i - 1] || "", s.line === s.end_line ? s.end_col : 999) * CW;
      out += `<rect class="ref" x="${x0 - 1}" y="${Y(i) + 1}" width="${Math.max(x1 - x0 + 2, CW)}" height="${LH - 2}" rx="3" fill="rgba(230,159,0,.16)" stroke="rgba(230,159,0,.55)"/>`;
    }
  }
  for (const f of (CANVAS && CANVAS_FILE === FILE ? CANVAS.frames : [])){
    const pts = f.stages.map(s => place(s.line, s.col)).filter(Boolean);
    if (pts.length < 2) continue;
    const spineX = Math.min(...pts.map(p => p.x)) - 6, top = Y(pts[0].i) + LH * .5, bot = Y(pts[pts.length - 1].i) + LH * .5;
    if (f.verb === "~>"){
      const body = f.stages[0], b0 = place(body.line, body.col), b1 = back.get(body.end_line);
      if (b0 && b1) out += `<rect class="frame" x="${b0.x - 8}" y="${Y(b0.i) + 1}" width="${Math.max(CW * 12, (Math.max(...rows.slice(b0.i - 1, b1).map(r => r.length)) - (b0.x - PADL) / CW) * CW + 16)}" height="${(b1 - b0.i + 1) * LH - 2}" rx="9" fill="rgba(230,159,0,.035)" stroke="rgba(230,159,0,.28)"/>`;
    }
    if (pts[0].i === pts[pts.length - 1].i) continue;   // a verb on one line draws no spine
    out += `<line class="frame" x1="${spineX}" y1="${top}" x2="${spineX}" y2="${bot}" stroke="rgba(86,180,233,.45)" stroke-width="1.4"/>`;
    for (const p of pts) out += `<circle cx="${spineX}" cy="${Y(p.i) + LH * .5}" r="2.8" fill="${VERB_HUE[f.verb]}"/>`;
    if (f.verb === "<~") out += `<path d="M ${spineX} ${bot} C ${spineX - 13} ${bot}, ${spineX - 13} ${top}, ${spineX} ${top}" fill="none" stroke="var(--verm-b)" stroke-width="1.2" opacity=".55"/>`;
  }
  // the traces of owned values: from the declaration's head to the use that consumes it
  for (const t of (CANVAS && CANVAS_FILE === FILE ? CANVAS.traces : [])){
    const head = back.get(t.head.line), uses = t.uses.map(u => place(u.line, u.col)).filter(Boolean);
    if (!head || !uses.length) continue;
    const x = PADL - 9, end = uses[uses.length - 1];
    out += `<line class="trace" x1="${x}" y1="${Y(head) + LH * .5}" x2="${x}" y2="${Y(end.i) + LH * .5}" stroke="var(--gold)" stroke-width="1.6" opacity=".5"/>`;
    uses.forEach((u, k) => { out += `<circle class="trace" cx="${x}" cy="${Y(u.i) + LH * .5}" r="${k === uses.length - 1 ? 3.2 : 2}" fill="var(--gold)" opacity="${k === uses.length - 1 ? .25 : .7}"/>`; });
  }
  // the proof marks at their claims
  for (const m of (CANVAS && CANVAS_FILE === FILE ? CANVAS.marks : [])){
    const p = place(m.site.line, m.site.line === m.site.end_line ? m.site.end_col : m.site.col); if (!p) continue;
    const [g, hue] = MARK[m.glyph] || MARK.open;
    out += `<text class="mark mark-${m.glyph}" x="${p.x + 2}" y="${Y(p.i) + LH * .38}" font-size="9" fill="${hue}">${g}</text>`;
  }
  $("topo-g").innerHTML = out; syncTopo();
}
function syncTopo(){ const ta = $("src"); $("topo-g").setAttribute("transform", `translate(${-ta.scrollLeft}, ${-ta.scrollTop})`); }

/* ── the wheel's host (ide/wheel-worker.js) — a cold run for what the session
   does not serve; the module compiled once, the memory from 256 MB up ──── */
let MODULE = null, VFS = {};
const MEM_PAGES = 4096;
function runWheel(req, timeoutMs = 90000){
  return new Promise(resolve => {
    const w = new Worker("wheel-worker.js");
    const t = setTimeout(() => { w.terminate(); resolve({ exit: 1, out: "", err: "", trapped: `timeout after ${timeoutMs} ms — the run was terminated`, tasks: 0 }); }, timeoutMs);
    w.onmessage = e => { if (e.data.k === "result"){ clearTimeout(t); w.terminate(); resolve(e.data); } };
    w.onerror = e => { clearTimeout(t); w.terminate(); resolve({ exit: 1, out: "", err: "", trapped: String(e.message || e), tasks: 0 }); };
    w.postMessage(Object.assign({ role: "run", module: MODULE, memPages: MEM_PAGES, dbg: location.search.includes("dbg") }, req));
  });
}
let SESSION = null;
function session(){
  if (!SESSION) SESSION = new MentlSession.Session({
    spawn: () => { const w = new Worker("wheel-worker.js"); return { post: m => w.postMessage(m), terminate: () => w.terminate(), onError: fn => { w.onerror = e => fn(e.message || e); } }; },
    module: MODULE, vfs: VFS, memPages: MEM_PAGES, runCold: req => runWheel(req),
  });
  return SESSION;
}

/* ── state: one program, one session, one caret, ONE View ──────────────────
   THE VIEW IS A PROJECTION (src/space.mn). `mentl space <address>` answers
   the record this page paints — the ring's eight facts at the caret, the
   Lens (every diagnostic the judgment reported, as the kind it is, at its
   own site, under one lead) and the Ledger (the module's declarations,
   obligations and tightenings, ranked for the caret) — and the page keeps
   no second model of truth: it parses nothing the wheel printed as prose.
   A refusal answers whole on stderr with its exit code (the cold route's
   law), and the page shows it as the Lens's lead. */
let PROGRAM = null;          // the manifest path of the program in the editor, or "scratch"
let FILE = "main.mn";        // the path the editor's text holds in the session's tree — a lesson is main.mn; a project's module keeps its name
let EXTRA_DELTA = {};        // a project's other modules, sent with the next edit so they stand beside the one in the editor
let VIEW = null, VIEW_AT = -1, VIEW_TEXT = null, REFUSAL = null, PROJECTED = false, LAST = null;
let NEEDLE = null;           // a name the find box asked for; the next caret move clears it
let PROPOSAL = null, busy = false, pendingEdit = false;
const lineColAt = off => { const before = $("src").value.slice(0, off); const nl = before.lastIndexOf("\n"); return { line: before.split("\n").length, col: off - nl }; };
const offsetOf = (line, col) => { const rows = $("src").value.split("\n"); let o = 0; for (let i = 0; i < line - 1 && i < rows.length; i++) o += rows[i].length + 1; return o + col - 1; };
const getOffset = () => $("src").selectionStart;
// a refusal crosses the wire as its stderr and exit code, and the compile's cost
// lines ride the same stderr; telling them apart by spelling is the residue of
// that text channel (Hβ.session.answer-is-out-err-and-exit names its end)
const COST_LINE = /^(heap|arena|session): /;

/* the loop: an edit re-judges the program in the resident session and asks
   the module's View — the canvas the text is painted from — then the View at
   the caret; a caret move alone is a read of the graph the session already
   holds, and so is a find */
async function project(edited){
  if (!MODULE || busy){ if (edited) pendingEdit = true; return; }
  busy = true; $("dot").className = "busy";
  const off = getOffset(); const { line, col } = lineColAt(off);
  // every request carries the text it is about; the session re-judges only
  // bytes it has not seen, so a read with the same text stays a read, and a
  // canvas is always labeled with the text the session judged
  const text = $("src").value;
  const delta = Object.assign({}, EXTRA_DELTA, { [FILE]: text });
  EXTRA_DELTA = {};
  if (edited || !CANVAS || CANVAS_FILE !== FILE || CANVAS_TEXT !== text){
    const m = await session().call(["mentl", "space", `${FILE}:0`], delta);
    try { if (m.exit === 0 && !m.trapped) takeCanvas(JSON.parse(m.out).canvas, text); } catch (e) {}
  }
  const ask = ["mentl", "space", `${FILE}:${line}:${col}`].concat(NEEDLE ? [NEEDLE] : []);
  const r = await session().call(ask, delta);
  VIEW = null; REFUSAL = null;
  if (r.exit === 0 && !r.trapped){
    try { VIEW = JSON.parse(r.out); }
    catch (e) { REFUSAL = `the View did not parse — ${e.message}\n${(r.out || "").slice(0, 200)}`; }
  } else {
    REFUSAL = r.trapped ? `the compiler hit a wall on this input — ${r.trapped}` :
      ((r.err || "").split("\n").filter(l => l.trim() && !COST_LINE.test(l)).join("\n") || `the address refused (exit ${r.exit})`);
  }
  VIEW_AT = off; VIEW_TEXT = text; PROJECTED = true;
  LAST = { ms: r.ms, resident: !!r.resident, bytes: (r.out || "").length, why: r.why || "" };
  BAD = VIEW ? new Set(VIEW.lens.filter(f => f.kind === "diag" && f.module === VIEW.at.module).map(f => f.site.line)) : new Set();
  $("sessinfo").textContent = `${LAST.resident ? "resident" : "cold"} · ${LAST.ms.toFixed(0)} ms · ${LAST.bytes.toLocaleString()} B`;
  $("dot").className = REFUSAL ? "bad" : VIEW.lens.some(f => f.kind === "diag" && f.refuses) ? "diag" : "ok";
  busy = false;
  renderAll();
  if (pendingEdit){ pendingEdit = false; project(true); }
  else if (getOffset() !== off) project(false);
}

/* ── the painter: every surface, from the one View ──────────────────────── */
function renderAll(){
  CURSOR_LINE = lineColAt(getOffset()).line;
  renderCanvas();
  renderRing(); renderLens(); renderLedger(); renderRefs(); renderProposal();
}
const stub = txt => `<span class="stub">${esc(txt)}</span>`;
// the eight aspects, in the kernel's order — the wire's kinds and the page's hues
const ASPECTS = ["query", "propose", "topology", "effects", "ownership", "verify", "teach", "why"];
const LABEL = { query: "graph", propose: "propose", topology: "topology", effects: "effects", ownership: "ownership", verify: "verify", teach: "teach", why: "why" };
const HUE = { query: "graph", propose: "hand", topology: "verb", effects: "row", ownership: "own", verify: "ref", teach: "grad", why: "why" };
const DOOR = { effects: "pledger", why: "plens" };
// what an aspect with nothing to say means at this position
const SILENCE = { query: "—", propose: "a ?? here is where the medium proposes; a perform says which install serves it", topology: "no verb holds this node",
  effects: "—", ownership: "inferred from use-count — unmarked", verify: "no open obligation at this node", teach: "nothing to add here", why: "—" };
// a note under an aspect, painted as its kind; a kind the page has not met still shows its text
function noteHtml(n){
  switch (n.kind){
    case "lede": return `<span class="lede">${esc(n.text)}</span>`;
    case "member": case "hop": return `<span class="hop">${esc(n.text)}</span>`;
    case "question": return `<span class="sub">${esc(n.text)}</span>`;
    case "refusal": return `<span class="sub">refused ${esc(n.name)} — ${esc(n.why)}</span>`;
    case "handler": return `<span class="sub">${esc(n.text)}</span>`;
    case "obligation": return `<span class="hop" data-l="${n.module === VIEW.at.module ? n.site.line : ""}">${esc(n.text)}</span>`;
    case "type-chain": return `<span class="hop">its type: ${esc(n.text)}</span>` + n.hops.map(h => `<span class="hop">${esc(h)}</span>`).join("");
    default: return `<span class="sub">${esc(n.text)}</span>`;
  }
}
function renderRing(){
  const V = (VIEW_AT === getOffset()) ? VIEW : null;
  $("asp-at").textContent = V ? `${V.at.module}:${V.at.line}:${V.at.col}` : (REFUSAL && VIEW_AT === getOffset()) ? "— refused —" : "— place the caret —";
  const rows = V ? V.ring.map(f => {
    const ledes = f.notes.filter(n => n.kind === "lede"), rest = f.notes.filter(n => n.kind !== "lede");
    const socket = f.kind === "propose" && (f.verdict === "fill" || f.verdict === "ask");
    const text = f.text ? esc(f.text) : stub(SILENCE[f.kind] || "—");
    return { kind: f.kind, k: HUE[f.kind] || "graph", label: LABEL[f.kind] || f.kind, prov: socket ? "socket" : "real", door: DOOR[f.kind] || null,
             v: ledes.map(noteHtml).join("") + text + rest.map(noteHtml).join("") };
  }) : ASPECTS.map(k => ({ kind: k, k: HUE[k], label: LABEL[k], prov: "surface", door: null, v: stub("—") }));
  $("facets").innerHTML = rows.map(r => `<div class="facet k-${r.k}${r.prov === "surface" ? "" : " real"}${r.door ? " door" : ""}${r.kind === LIT ? " lit" : ""}" data-kind="${r.kind}" ${r.door ? `data-door="${r.door}"` : ""}>
      <div class="k k-${r.k}">${r.label}<span class="prov prov-${r.prov}">${r.prov}</span></div><div class="v">${r.v}</div></div>`).join("");
  $("facets").querySelectorAll(".facet.door").forEach(el => el.onclick = () => openTab(el.dataset.door));
  $("facets").querySelectorAll(".hop[data-l]").forEach(el => el.onclick = e => { e.stopPropagation(); jump(parseInt(el.dataset.l || "0", 10)); });
}
function renderLens(){
  const p = $("plens");
  if (REFUSAL){ $("ndiag").textContent = "!"; p.innerHTML = `<div class="lead"><b>Mentl:</b> ${esc(REFUSAL)}</div>`; return; }
  if (!VIEW){ $("ndiag").textContent = "0"; p.innerHTML = `<div class="empty"><div class="big">…</div>projecting</div>`; return; }
  // every fact carries its own lead; the sentence over the Lens is the first own fact's
  const all = VIEW.lens.filter(f => f.kind === "diag");
  // the program's own reports first, as the wheel ranks them; a linked
  // module's (a library's comment citing a name this link never reaches)
  // fold under a count — true, and not this developer's line to fix
  const own = all.filter(d => d.module === VIEW.at.module), linked = all.filter(d => d.module !== VIEW.at.module);
  $("ndiag").textContent = own.length;
  if (!own.length){
    p.innerHTML = `<div class="empty"><div class="big">✓</div>clean — the graph is coherent<div class="sub">${PROGRAM ? esc(PROGRAM) : ""}${linked.length ? ` · ${linked.length} report${linked.length > 1 ? "s" : ""} in linked modules` : ""}</div></div>`;
    return;
  }
  // the hue is the fact's: its severity, whether it refuses, and whether its step is one the medium takes itself
  const row = d => `<div class="diag sev-${esc(d.severity)}${d.refuses ? " refuses" : ""} appl-${esc(d.applicability)}" data-l="${d.module === VIEW.at.module ? d.site.line : ""}">
      <div class="row1"><span class="code">${esc(d.code)}</span><span class="at">${esc(d.source)} · ${esc(d.module)}:${d.site.line}:${d.site.col} · ${esc(d.severity)}</span><span class="appl">${esc(d.applicability)}</span></div>
      <div class="msg">${esc(d.text)}</div></div>`;
  p.innerHTML = `<div class="lead"><b>Mentl:</b> ${esc(own[0].lead || "")}${own.length > 1 ? `<span class="subtle" style="display:block;margin-top:4px">the gradient ranks — one step first, ${own.length - 1} more below</span>` : ""}</div>`
    + own.map(row).join("")
    + (linked.length ? `<details class="linked"><summary class="subtle" style="padding:8px 14px;cursor:pointer">${linked.length} report${linked.length > 1 ? "s" : ""} in linked modules</summary>${linked.map(row).join("")}</details>` : "");
  p.querySelectorAll(".diag").forEach(el => el.onclick = () => jump(parseInt(el.dataset.l || "0", 10)));
}
function renderLedger(){
  const p = $("pledger");
  if (!VIEW){ p.innerHTML = `<div class="ledger"><div class="subtle">${REFUSAL ? "the address refused — no ledger to read." : "projecting…"}</div></div>`; return; }
  const decls = VIEW.ledger.filter(f => f.kind === "decl"), obls = VIEW.ledger.filter(f => f.kind === "obligation"), tights = VIEW.ledger.filter(f => f.kind === "tighten");
  let h = `<div class="ledger"><section><h5>declarations — nearest the caret first</h5>`;
  h += decls.length ? decls.map(d => `<div class="decl" data-l="${d.site.line}"><span class="word">${esc(d.word)}</span> <span class="name">${esc(d.name)}</span><span class="text">${esc(d.text)}</span></div>`).join("")
                    : `<div class="subtle">no declaration in this module.</div>`;
  h += `</section><section><h5>open obligations</h5>`;
  h += obls.length ? obls.map(o => `<div class="item" data-l="${o.module === VIEW.at.module ? o.site.line : ""}">${esc(o.text)}<span class="at">${esc(o.module)}:${o.site.line}</span></div>`).join("")
                   : `<div class="subtle">none — every claim in this module is discharged.</div>`;
  h += `</section><section><h5>tightenings</h5>`;
  h += tights.length ? tights.map(t => `<div class="item" data-l="${t.site.line}">${esc(t.text)}<span class="at">${esc(t.name)}</span></div>`).join("")
                     : `<div class="subtle">none — every authored row is what its body proves, or a decision.</div>`;
  h += `</section></div>`;
  p.innerHTML = h;
  p.querySelectorAll("[data-l]").forEach(el => el.onclick = () => jump(parseInt(el.dataset.l || "0", 10)));
}

/* ── the references a find follows: at the caret, what its node names along
   its edge; from the find box, a name's references and the string literals
   holding it — the medium's own `refs of` and `text`, carried on the View ─ */
function renderRefs(){
  const p = $("prefs"), R = VIEW && VIEW.refs;
  $("nrefs").textContent = R ? R.sites.length + R.texts.length : 0;
  if (!R){ p.innerHTML = `<div class="ledger"><div class="subtle">place the caret on a name, or type one in the find box — the references are the graph's edges, never a text search.</div></div>`; return; }
  const row = (r, kind) => `<div class="item" data-l="${r.module === VIEW.at.module ? r.site.line : ""}" data-c="${r.site.col}">${esc(kind)}<span class="at">${esc(r.module)}:${r.site.line}:${r.site.col}</span></div>`;
  p.innerHTML = `<div class="ledger"><section><h5>references to <code>${esc(R.needle)}</code></h5>${R.sites.length ? R.sites.map(r => row(r, "reference")).join("") : `<div class="subtle">none in the judged graph.</div>`}</section>`
    + (R.texts.length ? `<section><h5>string literals holding it</h5>${R.texts.map(r => row(r, "text")).join("")}</section>` : "") + `</div>`;
  p.querySelectorAll("[data-l]").forEach(el => el.onclick = () => jump(parseInt(el.dataset.l || "0", 10), parseInt(el.dataset.c || "1", 10)));
}
// a strip cell is a door into the ring: the caret goes to the cell's site and
// the aspect's row is lit when the View there arrives
let LIT = null;
function openAspect(arm, line, col){ LIT = arm; jump(line, col); }

/* ── the socket: the one proven proposal at the hole under the caret; Tab
   accepts it through `mentl accept` — a graph edge first, the text its
   projection (C4); the next View read is the redraw ──────────────────────── */
function proposalAt(off){
  if (!VIEW || VIEW_AT !== off) return null;
  const f = VIEW.ring.find(r => r.kind === "propose");
  if (!f || f.verdict !== "fill") return null;
  // a fill is proposed only at an authored hole (src/space.mn propose_fact), so the verdict is the whole test
  const sp = VIEW.at.span;
  return { at: offsetOf(sp.line, sp.col), line: sp.line, col: sp.col, now: f.fill, why: f.why };
}
function renderProposal(){
  const el = $("proposal"); PROPOSAL = proposalAt(getOffset());
  if (!PROPOSAL){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<span class="tag">fill the hole</span><span class="was">??</span><span>→</span><span class="now"><span class="socket"></span>${esc(PROPOSAL.now)}</span>` +
    (PROPOSAL.why ? `<span class="why">${esc(PROPOSAL.why)}</span>` : "") + `<span class="key"><b>⇥ Tab</b> accepts</span>`;
}
async function acceptProposal(){
  const p = PROPOSAL; if (!p) return false;
  const ta = $("src");
  $("dot").className = "busy";
  const r = await session().call(["mentl", "accept", `${FILE}:${p.line}:${p.col}`], Object.assign({}, EXTRA_DELTA, { [FILE]: ta.value }));
  EXTRA_DELTA = {};
  const wrote = r.written && r.written[FILE];
  if (r.exit !== 0 || r.trapped || !wrote){
    $("dot").className = "bad"; REFUSAL = (r.err || r.trapped || "the accept drew nothing").trim().split("\n").filter(l => !COST_LINE.test(l)).join("\n"); VIEW = null; renderLens(); renderLedger(); return true;
  }
  const text = typeof wrote === "string" ? wrote : td.decode(wrote);
  writeBuffer(text);
  ta.setSelectionRange(p.at, p.at);
  // the session wrote the text and re-judged it before it answered, so the redraw is a read
  saveDraft(); project(false);
  return true;
}

/* ── the medium's writes into the buffer — an accept, the formatter's canon —
   go through the browser's own editing command, so each is ONE step of the
   undo the hand already has: ⌘Z takes the medium's step back. The trail as
   undo, measured: `setRangeText` (the form before L-D) records nothing, and
   the smoke's undo after an accept left the accepted text in place. */
function writeBuffer(text){
  const ta = $("src"); ta.focus(); ta.setSelectionRange(0, ta.value.length);
  if (!document.execCommand("insertText", false, text)) ta.setRangeText(text, 0, ta.value.length, "end");
}

/* ── programs: the lessons the manifest names (each a one-file project), the
   projects it names (a folder of modules — the session's entry is its
   main.mn, the rest its imports, every one editable), and your own scratch.
   A project's modules are mounted in the session's tree under their own
   names, so `import scene` resolves beside main.mn exactly as the terminal
   resolves it beside the entry; the module in the editor rides the delta
   under its own path and the address targets it. A draft is kept per file
   in this browser until the files are the project's own (the File System
   Access API, where a host has it). ───────────────────────────────────── */
const programName = path => path.replace(/^lib\/tutorial\//, "").replace(/\.mn$/, "").replace(/^(\d\d)-/, "$1 · ");
const ENTRIES = [];   // what the select offers: { key, label, dir, path, file }
const VFS_TEXT = {};
const draftKey = path => "mentl-space-draft:" + path;
function saveDraft(){ try { localStorage.setItem(draftKey(PROGRAM), $("src").value); } catch (e) {} }
// the caret and the scroll are kept with the draft, so a reopened file reopens where the hand left it
function saveCaret(){ try { localStorage.setItem("mentl-space-caret:" + PROGRAM, JSON.stringify([$("src").selectionStart, $("src").scrollTop])); } catch (e) {} }
function caretOf(path){ try { const c = JSON.parse(localStorage.getItem("mentl-space-caret:" + path) || "null"); if (Array.isArray(c)) return c; } catch (e) {} return [0, 0]; }
function draftOr(path){ try { const d = localStorage.getItem(draftKey(path)); if (d !== null) return d; } catch (e) {} return path === "scratch" ? "fn main() = 42\n" : VFS_TEXT[path]; }
function openEntry(key){
  const e = ENTRIES.find(x => x.key === key) || ENTRIES[0];
  PROGRAM = e.path; FILE = e.file;
  EXTRA_DELTA = {};
  if (e.dir) for (const m of PROJECTS.find(p => p.dir === e.dir).members) if (m !== e.path) EXTRA_DELTA[m.slice(e.dir.length + 1)] = draftOr(m);
  const ta = $("src"); ta.value = draftOr(e.path);
  const [off, top] = caretOf(e.path); ta.setSelectionRange(Math.min(off, ta.value.length), Math.min(off, ta.value.length)); ta.scrollTop = top;
  VIEW = null; REFUSAL = null; VIEW_AT = -1; PROJECTED = false; NEEDLE = null; CANVAS = null; TOK = new Map(); STRIP = new Map();
  project(true);
}

/* ── wiring ─────────────────────────────────────────────────────────────── */
function syncScroll(){ const ta = $("src"); $("hl").scrollTop = ta.scrollTop; $("hl").scrollLeft = ta.scrollLeft; $("gutter").scrollTop = ta.scrollTop; syncTopo(); }
// the painted window follows the scroll: a scroll that leaves it repaints
function onScroll(){ const [a, b] = VIEW_RANGE, n = $("src").value.split("\n").length, [c, d] = visibleRange(n);
  if (c < a || d > b) renderCanvas(); else syncScroll(); saveCaret(); }
function jump(line, col){ if (!line) return; const ta = $("src"); const idx = ta.value.split("\n").slice(0, line - 1).join("\n").length + (line > 1 ? 1 : 0) + Math.max(0, (col || 1) - 1);
  ta.focus(); ta.setSelectionRange(idx, idx); if (line < VIEW_RANGE[0] + 3 || line > VIEW_RANGE[1] - 3 || ta.scrollTop > (line - 1) * LH) ta.scrollTop = Math.max(0, (line - 6) * LH); NEEDLE = null; project(false); }
function openTab(p){ document.querySelectorAll(".tabs div[data-p]").forEach(x => x.classList.toggle("on", x.dataset.p === p)); document.querySelectorAll(".panel").forEach(x => x.classList.toggle("on", x.id === p)); }
let editDeb = null, caretDeb = null;
$("src").addEventListener("scroll", onScroll);
$("src").addEventListener("input", () => { CURSOR_LINE = lineColAt(getOffset()).line; renderCanvas(); saveDraft(); clearTimeout(editDeb); editDeb = setTimeout(() => project(true), 180); scheduleFmt(); });
["click", "keyup"].forEach(ev => $("src").addEventListener(ev, () => { saveCaret(); clearTimeout(caretDeb); caretDeb = setTimeout(() => { if (getOffset() !== VIEW_AT){ NEEDLE = null; LIT = null; project(false); } else renderAll(); }, 40); }));
$("find").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); const n = $("find").value.trim(); NEEDLE = n || null; openTab("prefs"); project(false); }
  if (e.key === "Escape"){ $("find").value = ""; NEEDLE = null; project(false); }
});

/* ── the formatter's canon on idle: when the hand pauses, `mentl fmt` renders
   the file and the render replaces the buffer — never mid-keystroke, never
   when fmt refuses (a render that would lose what the author wrote, or a
   text that does not parse, writes nothing). The caret keeps its place among
   the characters that are not layout, and the replacement is one step of the
   native undo, so ⌘Z takes the formatter's step back. */
let fmtDeb = null, fmtGen = 0, FMT_IDLE_MS = 1500;
function scheduleFmt(){ clearTimeout(fmtDeb); if (FMT_IDLE_MS > 0) fmtDeb = setTimeout(fmtIdle, FMT_IDLE_MS); }
async function fmtIdle(){
  if (busy){ scheduleFmt(); return; }
  const ta = $("src"), before = ta.value, gen = ++fmtGen;
  const r = await session().call(["mentl", "fmt", FILE], Object.assign({}, EXTRA_DELTA, { [FILE]: before }));
  if (gen !== fmtGen || ta.value !== before) return;                      // the hand moved: canon waits for the next pause
  const w = r.written && r.written[FILE];
  const text = w ? (typeof w === "string" ? w : td.decode(w)) : null;
  if (!text || text === before) return;
  const ink = s => s.replace(/\s/g, "").length;                          // the characters that are not layout
  const k = ink(before.slice(0, ta.selectionStart));
  let at = 0; for (let seen = 0; at < text.length && seen < k; at++) if (!/\s/.test(text[at])) seen++;
  writeBuffer(text);
  ta.setSelectionRange(at, at);
  saveDraft(); project(true);
}
$("src").addEventListener("keydown", e => {
  if (e.key === "Tab"){ e.preventDefault(); if (PROPOSAL){ acceptProposal(); return; } const ta = e.target; ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
});
document.querySelectorAll(".tabs div[data-p]").forEach(t => t.onclick = () => openTab(t.dataset.p));
$("theme").onclick = () => { const cur = document.documentElement.dataset.theme; const next = cur === "parchment" ? "obsidian" : "parchment"; document.documentElement.dataset.theme = next; try { localStorage.setItem("mentl-space-theme", next); } catch (x) {} };
$("program").onchange = e => openEntry(e.target.value);
window.addEventListener("resize", () => { measureMetrics(); renderCanvas(); });
try { const qt = new URLSearchParams(location.search).get("theme"); if (qt) document.documentElement.dataset.theme = qt; const th = qt || localStorage.getItem("mentl-space-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

/* ── boot ───────────────────────────────────────────────────────────────── */
const T_BOOT = performance.now();
const settled = async (max = 400) => { for (let i = 0; i < max && (busy || !PROJECTED); i++) await new Promise(r => setTimeout(r, 50)); };
async function boot(){
  try {
    await readManifest();
    if (!(await ensureIsolated())) throw new Error("the page is not cross-origin isolated and could not isolate itself — serve it with the two headers (tools/space-serve.py) or over https");
    const MEMBERS = PROJECTS.flatMap(p => p.members);
    const [wasm, ...texts] = await Promise.all([
      fetch(BASE + WASM_PATH).then(r => { if (!r.ok) throw new Error(`${WASM_PATH} is missing (${r.status})`); return r.arrayBuffer(); }),
      ...LIBS.map(fetchText), ...PROGRAMS.map(fetchText), ...MEMBERS.map(fetchText),
    ]);
    LIBS.forEach((k, i) => { VFS[k] = te.encode(texts[i]); });
    PROGRAMS.forEach((k, i) => { VFS_TEXT[k] = texts[LIBS.length + i]; });
    MEMBERS.forEach((k, i) => { VFS_TEXT[k] = texts[LIBS.length + PROGRAMS.length + i]; });
    MODULE = await WebAssembly.compile(wasm);
    const sel = $("program");
    const offer = (e, parent) => { ENTRIES.push(e); const o = document.createElement("option"); o.value = e.key; o.textContent = e.label; parent.appendChild(o); };
    for (const p of PROGRAMS) offer({ key: p, label: programName(p), dir: null, path: p, file: "main.mn" }, sel);
    for (const pr of PROJECTS){
      const g = document.createElement("optgroup"); g.label = pr.dir;
      for (const m of pr.members) offer({ key: m, label: m.slice(pr.dir.length + 1), dir: pr.dir, path: m, file: m.slice(pr.dir.length + 1) }, g);
      sel.appendChild(g);
    }
    offer({ key: "scratch", label: "scratch", dir: null, path: "scratch", file: "main.mn" }, sel);
    $("dot").className = "ok"; measureMetrics();
    openEntry(ENTRIES[0].key);
    // the one line the page prints on every open: a headless driver (ide/browser-leg.mjs) waits on it
    await settled();
    console.log(`SPACE-READY boot=${(performance.now() - T_BOOT).toFixed(0)}ms program=${PROGRAM} theme=${document.documentElement.dataset.theme || "system"}`);
    if (location.search.includes("smoke")) smoke();
  } catch (e) {
    const b = $("err-banner"); b.style.display = "block"; b.textContent = "boot failed: " + e.message;
    if (location.search.includes("smoke")) console.log("SMOKE-BOOT-FAIL " + e.message);
    $("dot").className = "bad";
  }
}

/* ── the gate's wire (?smoke): the verdicts a headless browser can read ──── */
const tick = ms => new Promise(r => setTimeout(r, ms));
async function smoke(){
  FMT_IDLE_MS = 0;   // the formatter's own leg below drives it; nothing else may reformat a fixture mid-measure
  await settled(200);
  // THE VIEW: the first lesson's View arrived from the session — eight ring
  // facts, no refusing diagnostic, the ledger present — and a second read of
  // it is resident and timed; its size in bytes is printed, never assumed
  const { line } = lineColAt($("src").value.indexOf("fn "));
  const a = await session().call(["mentl", "space", `${FILE}:${line}:4`]);
  const b = await session().call(["mentl", "space", `${FILE}:${line}:4`]);
  const diag = f => f.kind === "diag";
  const viewOf = r => { try { return r.exit === 0 ? JSON.parse(r.out) : null; } catch (e) { return null; } };
  let v = viewOf(b);
  console.log(`SMOKE-VIEW open=${(session().opened ? session().opened.ms : a.ms).toFixed(0)} read=${b.ms.toFixed(1)} resident=${!!(a.resident && b.resident)} bytes=${b.out.length} ring=${v ? v.ring.length : 0} lens=${v ? v.lens.filter(diag).length : -1} refusing=${v ? v.lens.filter(f => diag(f) && f.refuses).length : -1} ledger=${v ? v.ledger.length : -1}`);
  // THE PROJECT: a folder of modules the manifest names opens in the same
  // session — its main.mn the entry, its View from the resident session
  const pr = PROJECTS[0], pm = pr && ENTRIES.find(e => e.dir === pr.dir && e.file === "main.mn");
  if (pm){
    openEntry(pm.key); await settled(1200);
    const pv = VIEW, members = pr.members.length;
    console.log(`SMOKE-PROJECT dir=${pr.dir} members=${members} file=${FILE} resident=${!!(LAST && LAST.resident)} ring=${pv ? pv.ring.length : 0} refusing=${pv ? pv.lens.filter(f => diag(f) && f.refuses).length : -1} module=${pv ? pv.at.module : "-"} canvas-lines=${CANVAS ? CANVAS.lines : 0} painted=${document.querySelectorAll("#hl .ln").length}`);
    openEntry(ENTRIES[0].key); await settled(400);
  }
  // THE PRODUCT: what the page renders, measured — fidelity (every painted
  // line shows every character the hand typed), no undefined anywhere in the
  // chrome, eight real ring rows painted from the View, and the Lens
  // structural: a Warning lands as a Warning at its own line and a mismatch
  // at its own site
  jump(line); await tick(400); await settled(100);
  const ta = $("src");
  const fidelity = linesFaithful();
  const realRows = document.querySelectorAll(".facet.real").length;
  ta.value = '// `nothing_here` is a reference that resolves nowhere\nfn f(x: Int) = x\n\nfn main() = f("x")\n';
  ta.setSelectionRange(0, 0); PROJECTED = false; await project(true); await settled(100);
  const warnAt = !!$("plens").querySelector(".diag.sev-Warning[data-l='1']");
  const mismatchAt = !!$("plens").querySelector(".diag.sev-error[data-l='4']");
  const diags = VIEW ? VIEW.lens.filter(diag).length : -1;
  // the chrome alone: the editor layers and the page's own code are data, not the page's words
  const chrome = document.body.cloneNode(true); for (const id of ["hl", "src", "gutter"]) chrome.querySelector("#" + id)?.remove();
  chrome.querySelectorAll("script, style").forEach(e => e.remove());
  const html = chrome.innerHTML; const ui = html.indexOf("undefined");
  const undef = ui >= 0 ? JSON.stringify(html.slice(Math.max(0, ui - 70), ui + 12)) : false;
  console.log(`SMOKE-PRODUCT fidelity=${fidelity} undefined=${undef} ring-real=${realRows} lens-warning-at-line=${warnAt} lens-mismatch-at-site=${mismatchAt} diags=${diags} program=${PROGRAM}`);
  // THE CANVAS (L-D): the text painted from the wheel's own spans — no
  // tokenizer in the page, every painted token the source sliced at the
  // span the canvas names, every strip cell the View's own cell at its line,
  // the frames and marks drawn from the canvas; find by edge at a caret and
  // from the box; the formatter's canon on idle; the medium's write a step
  // of the native undo
  ta.value = CANVAS_FIXTURE; ta.setSelectionRange(0, 0); PROJECTED = false; await project(true); await settled(100);
  const lexer = typeof tokenize === "undefined" && typeof highlight === "undefined";
  const spans = spansFaithful();
  const strip = stripFaithful();
  const frames = document.querySelectorAll("#topo .frame").length, marks = document.querySelectorAll("#topo .mark").length;
  jump(2, 16); await tick(150); await settled(100);   // `x` in `x * 2`: the parameter's references, by its edge
  const atCaret = VIEW && VIEW.refs ? VIEW.refs.sites.filter(r => r.module === VIEW.at.module).length : -1;
  const refsDrawn = document.querySelectorAll("#topo .ref").length;
  $("find").value = "double"; NEEDLE = "double"; await project(false); await settled(100);
  const needle = VIEW && VIEW.refs && VIEW.refs.needle === "double" ? VIEW.refs.sites.length + VIEW.refs.texts.length : -1;
  const listed = $("prefs").querySelectorAll(".item").length;
  $("find").value = ""; NEEDLE = null;
  // the formatter on idle: a pause renders the file canonical
  ta.value = "fn main()  =  42\n"; ta.setSelectionRange(4, 4); PROJECTED = false; await project(true); await settled(100);
  FMT_IDLE_MS = 200; ta.dispatchEvent(new Event("input"));
  for (let i = 0; i < 100 && ta.value === "fn main()  =  42\n"; i++) await tick(100);
  FMT_IDLE_MS = 0;
  const fmt = ta.value === "fn main() = 42\n";
  // the accept is one step of the undo the hand already has
  ta.value = "type Positive = Int where 0 < self\n\nfn choose() -> Positive with Pure = ??\n\nfn main() = choose()\n";
  ta.focus(); ta.setSelectionRange(0, 0); PROJECTED = false; await project(true); await settled(100);
  const hole = ta.value.indexOf("??"); ta.setSelectionRange(hole, hole); await project(false); await settled(100);
  const proposed = !!PROPOSAL; await acceptProposal(); await settled(100);
  const accepted = !ta.value.includes("??");
  document.execCommand("undo");
  const undone = ta.value.includes("??");
  // the page as the record's screenshot shows it: the canvas fixture, the caret on a stage of its chain
  ta.value = CANVAS_FIXTURE; PROJECTED = false; await project(true); await settled(100); jump(19, 8); await tick(200); await settled(100);
  console.log(`SMOKE-CANVAS no-page-lexer=${lexer} tokens=${CANVAS ? CANVAS.tokens.length : 0} spans=${spans} strip=${strip} frames=${frames} marks=${marks} refs-at-caret=${atCaret} refs-drawn=${refsDrawn} needle=${needle} needle-listed=${listed} fmt=${fmt} proposed=${proposed} accepted=${accepted} undone=${undone}`);
}
// every painted line is the source's line, character for character
function linesFaithful(){
  const rows = $("src").value.split("\n");
  const painted = [...document.querySelectorAll("#hl .ln")];
  return painted.length > 0 && painted.every(el => el.textContent === rows[+el.dataset.n - 1]);
}
// every painted token is the source sliced at the span the canvas names, in order
function spansFaithful(){
  if (!CANVAS || CANVAS_TEXT !== $("src").value) return "no-canvas";
  const rows = $("src").value.split("\n"); let want = 0, bad = 0;
  for (const el of document.querySelectorAll("#hl .ln")){
    const n = +el.dataset.n, line = rows[n - 1];
    const expect = (TOK.get(n) || []).filter(t => CLS[t[2]]).map(t => line.slice(byteIndex(line, t[0]), byteIndex(line, t[1])));
    const got = [...el.querySelectorAll("span")].map(s => s.textContent);
    want += expect.length; if (JSON.stringify(expect) !== JSON.stringify(got)) bad++;
  }
  return bad === 0 && want > 0 ? `${want}` : `bad${bad}/${want}`;
}
// every strip cell painted is the View's cell at its line, and every cell the View has is painted
function stripFaithful(){
  if (!CANVAS) return "no-canvas";
  let want = 0, bad = 0;
  for (const g of document.querySelectorAll("#gutter .gl")){
    const n = +g.querySelector(".num").textContent, cells = STRIP.get(n) || [];
    const painted = [...g.querySelectorAll(".cell")].map(c => c.dataset.arm ? `${c.dataset.arm}:${[...c.classList].find(k => k.startsWith("st-")).slice(3)}` : "");
    const expect = ARMS.map((arm, k) => cells[k] ? `${arm}:${cells[k].glyph}` : "");
    want += expect.filter(Boolean).length; if (JSON.stringify(painted) !== JSON.stringify(expect)) bad++;
  }
  return bad === 0 && want > 0 ? `${want}` : `bad${bad}/${want}`;
}
const CANVAS_FIXTURE = [
  "// `double` doubles — the lede",
  "fn double(x) = x * 2",
  "",
  "effect Ask {",
  "  ask() -> Int",
  "}",
  "",
  "handler one {",
  "  ask() => resume(1),",
  "}",
  "",
  "fn needs() = ask() + 1",
  "",
  "fn inv(n) = 100 / n",
  "",
  "fn main() = {",
  "  let a = (ask() + needs()) ~> one",
  "  let b = [1, 2, 3]",
  "    |> map(double)",
  "    |> len",
  "  let c = 100 / 5",
  "  a + b + c + inv(4) + (\"s{a}\" |> len)",
  "}",
  "",
].join("\n");
boot();
</script>
